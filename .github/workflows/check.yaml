name: check
on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        version: [latest, nightly]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@develop
        with:
          version: ${{ matrix.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: moon version --all
      - run: moon check --target all --deny-warn
      - name: Check formatting and interfaces
        run: |
          moon info --target all
          moon fmt --check
          git diff --exit-code
      - run: moon test --target all
      - run: moon test --target all --release

  moon-json-format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check `moon.*.json` format
        shell: bash
        run: |
          _passed=0;
          for f in $(find . -type f -name "moon.*.json"); do
            if ! jq '.' $f > /dev/null; then
              echo $f;
              _passed=1;
            fi
          done
          (exit $_passed)

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: |
          npm install --global prettier;
          find . -name *.mod.json -exec npx prettier --write {} \;
          find . -name *.pkg.json -exec npx prettier --write {} \;
          git diff --exit-code;

  check-typos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: AutoCorrect
        uses: huacnlee/autocorrect-action@v2

      - name: typos-action
        uses: crate-ci/typos@v1.31.1
